spring:

    application:
        name: job-processing-system

    data:
        mongodb:
            uri: mongodb://localhost:27017/jobdb

    kafka:
        bootstrap-servers: localhost:9092

        consumer:
            group-id: job-worker-group
            auto-offset-reset: earliest
            enable-auto-commit: false

server:
    port: 8080
    shutdown: graceful

    lifecycle:
        timeout-per-shutdown-phase: 30s

job:
    kafka:
        topic: jobs
        partitions: 6
        replication-factor: 1
    worker:
        threads: 4
        queue-capacity: 1000
    retry:
        scan-delay-ms: 5000

management:
    endpoints:
        web:
            exposure:
                include: health,info,shutdown
    endpoint:
        shutdown:
            enabled: true